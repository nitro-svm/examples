[package]
name = "backtest-example"
version = "0.1.0"
edition = "2024"
description = "Solana simulation examples"

[dependencies]
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_with = "3"
simulator-api = "0.30.0"
simulator-client = "0.30.0"
solana-account = "5.0.0"
solana-account-decoder = "4.4.1"
solana-address = "2.7.0"
solana-address-lookup-table-interface = { version = "4.0.0", features = ["bincode", "bytemuck"] }
solana-client = "4.4.1"
solana-commitment-config = "3.1.1"
solana-loader-v3-interface = "9.0.0"
solana-pubkey = "3"
solana-rpc-client = "4.4.1"
solana-rpc-client-api = "4.4.1"
solana-signature = "3.5.2"
solana-message = "5.0.0"
solana-transaction = "5.0.0"
solana-transaction-error = "4.0.0"
solana-transaction-status = "4.4.1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
rstest = "0.26"
